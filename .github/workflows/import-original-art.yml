name: Import original Google Site artwork
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import_original_art.py
      - .github/workflows/import-original-art.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/import_original_art.py
      - name: Commit original artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/original/
          git diff --cached --quiet || (git commit -m "Import original Atom-first Biology artwork" && git push)
